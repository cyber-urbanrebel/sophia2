<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Sophia Platform{% endblock %}</title>
  <style>
    body { background: #0f172a; color: #e2e8f0; font-family: Arial, sans-serif; margin: 0; padding: 0; }
    .container { max-width: 840px; margin: 2rem auto; padding: 2rem; background: rgba(15, 23, 42, 0.90); border:1px solid #334155; border-radius: 12px; }
    .btn { display: inline-block; padding: 0.55rem 1rem; border-radius: 8px; border: none; font-weight: 700; cursor:pointer; }
    .btn-primary { background:#0ea5e9; color:#020617; }
    .btn-secondary { background:#475569; color:#e2e8f0; }
    input, textarea, select { width:100%; padding:0.65rem; margin:0.35rem 0 1rem; border:1px solid #334155; border-radius:8px; background:#020617; color:#e2e8f0; box-sizing: border-box; }
    .alert { padding:0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
    .alert-success { background:#22c55e33; border:1px solid #22c55e; }
    .alert-error { background:#ef444433; border:1px solid #ef4444; }
    a { color:#38bdf8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    nav a { margin-right:1rem; }
    .field-errors { color:#fca5a5; font-size:0.875rem; }
    h1 { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <a href="{% url 'home' %}">Home</a>
      {% if user.is_authenticated %}
        <a href="{% url 'profile' %}">Profile</a>
        <a href="{% url 'logout' %}">Logout</a>
      {% else %}
        <a href="{% url 'login' %}">Log in</a>
        <a href="{% url 'register' %}">Register</a>
      {% endif %}
    </nav>

    {% for message in messages %}
      <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">{{ message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
