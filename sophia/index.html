<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOPHIA — Self Development Engine</title>
  <meta name="description" content="SOPHIA: A disciplined, philosophical platform for self-development and personal growth.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>S</text></svg>">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/pages.css">
  <style>
    /* Auth overlay styles */
    #auth-overlay {
      position: fixed; inset: 0; z-index: 10000;
      display: flex; align-items: center; justify-content: center;
    }
    #auth-overlay.hidden { display: none; }
    .auth-backdrop {
      position: absolute; inset: 0;
      background: rgba(15, 15, 26, 0.95);
      backdrop-filter: blur(20px);
    }
    .auth-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 36px;
      box-shadow: var(--shadow-lg), 0 0 40px rgba(97, 86, 55, 0.342);
      animation: scaleIn 0.4s ease;
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-logo {
      font-family: var(--font-serif);
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.2em;
    }
    .auth-tagline {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .auth-form h2 { color: var(--text-primary); margin-bottom: 20px; }
    .auth-footer {
      text-align: center;
      margin-top: 16px;
      font-size: 0.875rem;
    }
    .auth-footer a {
      color: var(--gold);
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .auth-demo {
      text-align: center;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .auth-lockout {
      background: var(--rose-dim);
      color: var(--rose);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      margin-bottom: 16px;
    }
    .hidden { display: none !important; }
    .password-strength {
      margin-top: 6px;
    }
    .pw-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .pw-fill {
      height: 100%;
      width: 0;
      transition: width 0.3s ease, background 0.3s ease;
      border-radius: 2px;
    }
    .pw-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
      display: block;
    }
    /* Loading spinner */
    .app-loader {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg-primary);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 0.5s ease;
    }
    .app-loader.fade-out { opacity: 0; pointer-events: none; }
    .app-loader-logo {
      font-family: var(--font-serif);
      font-size: 3rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.3em;
      animation: pulse 2s ease-in-out infinite;
    }
    .app-loader-sub {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <!-- Particle Background -->
  <canvas id="pcanvas"></canvas>

  <!-- Loading Screen -->
  <div class="app-loader" id="app-loader">
    <div class="app-loader-logo">SOPHIA</div>
    <div class="app-loader-sub">Loading your journey...</div>
  </div>

  <!-- Auth Overlay -->
  <div id="auth-overlay" class="hidden"></div>

  <!-- App Shell -->
  <div id="app" class="app">
    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar"></aside>

    <!-- Main Content -->
    <div class="main-wrapper">
      <header id="topbar" class="topbar"></header>
      <main id="main-content" class="main-content" style="animation: fadeSlideUp 0.3s ease;"></main>
    </div>
  </div>

  <!-- Floating AI Agent (hidden until logged in) -->
  <button id="ai-fab" class="ai-fab" title="Ask Sophia AI" aria-label="Open AI Coach" style="display:none;">
    <svg class="ai-fab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="28" height="28">
      <circle cx="12" cy="12" r="10" stroke-dasharray="4 2" class="ai-orbit"/>
      <circle cx="12" cy="12" r="4" fill="var(--gold)" stroke="none"/>
      <line x1="12" y1="2" x2="12" y2="5" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="19" x2="12" y2="22" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
      <line x1="2" y1="12" x2="5" y2="12" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
      <line x1="19" y1="12" x2="22" y2="12" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="ai-fab-pulse"></span>
  </button>

  <!-- AI Chat Panel -->
  <div id="ai-panel" class="ai-panel">
    <div class="ai-panel-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="ai-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5" width="22" height="22">
            <circle cx="12" cy="12" r="4" fill="var(--gold)" stroke="none"/>
            <circle cx="12" cy="12" r="10" stroke-dasharray="4 2"/>
          </svg>
        </div>
        <div>
          <h4 style="font-size:0.9375rem;margin:0;">Sophia AI</h4>
          <span style="font-size:0.6875rem;color:var(--emerald);">Online</span>
        </div>
      </div>
      <button id="ai-panel-close" class="btn btn-ghost btn-icon" style="padding:4px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="ai-messages" class="ai-messages"></div>
    <form id="ai-input-form" class="ai-input-bar">
      <input type="text" id="ai-input" class="form-input" placeholder="Ask Sophia anything..." autocomplete="off" maxlength="500">
      <button type="submit" class="btn btn-primary" style="padding:8px 14px;border-radius:var(--radius-sm);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </form>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Upgrade Modal -->
  <div class="modal-overlay" id="upgrade-modal" style="display:none;">
    <div class="modal" style="max-width:480px;">
      <div class="modal-header">
        <h3>Upgrade to Premium</h3>
        <button class="btn btn-ghost btn-icon" onclick="Utils.hideUpgradeModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" style="text-align:center;padding:24px;">
        <div style="width:48px;height:48px;margin:0 auto 16px;color:var(--gold);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <p style="color:var(--text-secondary);margin-bottom:20px;" id="upgrade-feature-text">This feature requires a Premium subscription.</p>
        <a href="#payment" class="btn btn-primary btn-lg" onclick="Utils.hideUpgradeModal()">View Plans</a>
      </div>
    </div>
  </div>

  <!-- Scripts (load order matters) -->
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/path.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/mind.js"></script>
  <script src="js/body.js"></script>
  <script src="js/habits.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/payment.js"></script>
  <script src="js/ai-agent.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Hide loader after everything loads
    window.addEventListener('load', () => {
      const loader = document.getElementById('app-loader');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 500);
      }
    });
  </script>
</body>
</html>
