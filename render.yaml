# Render Blueprint — sophia2
# Dashboard: New → Blueprint → this repo (main).
# After first deploy, set WEB_ORIGIN on sophia-api to the sophia-web URL
# (https://sophia-web.onrender.com, no trailing slash) if CORS is still tight.

databases:
  - name: sophia-db
    databaseName: sophia
    user: sophia
    plan: free

services:
  - type: web
    name: sophia-api
    runtime: python
    plan: free
    rootDir: backend
    pythonVersion: "3.12.8"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sophia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false

  - type: web
    name: sophia-web
    runtime: static
    plan: free
    rootDir: sophia_mobile_web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sophia-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_USE_FIREBASE
        value: "true"
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
