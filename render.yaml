# Render "Blueprint" — lets you deploy the backend by pointing Render at
# this repo and clicking "New Blueprint Instance" instead of configuring
# everything by hand. See README.md "Going Live" section for the full
# step-by-step, including the frontend (deployed separately on Vercel).
services:
  - type: web
    name: sophia-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false # set this to your deployed Vercel URL, e.g. https://sophia.vercel.app
      - key: DATABASE_PATH
        value: ./sophia.db
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
